<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1200 620"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">The Itself agent assurance lifecycle</title>
  <desc id="description">
    A model assertion or a decision model's probability becomes a testable
    claim with a declared expected result.
    An external check produces evidence. Declared evaluation and authority
    control the resulting action. Every stage is retained in a validated
    evidence ledger and projected into a reasoning receipt.
  </desc>

  <defs>
    <marker
      id="arrow"
      markerWidth="8"
      markerHeight="8"
      refX="7"
      refY="4"
      orient="auto"
      markerUnits="strokeWidth"
    >
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#90a0b5" />
    </marker>
    <marker
      id="arrow-bright"
      markerWidth="8"
      markerHeight="8"
      refX="7"
      refY="4"
      orient="auto"
      markerUnits="strokeWidth"
    >
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#62d6ca" />
    </marker>
  </defs>

  <style>
    .surface { fill: #0d1117; stroke: #30363d; }
    .eyebrow { fill: #b89cff; }
    .heading { fill: #f0f6fc; }
    .subheading { fill: #9da7b3; }
    .zone-generated { fill: #171326; stroke: #352b54; }
    .zone-external { fill: #0e201f; stroke: #214b47; }
    .zone-governed { fill: #112118; stroke: #284d34; }
    .phase-generated { fill: #b89cff; }
    .phase-external { fill: #62d6ca; }
    .phase-governed { fill: #7bd492; }
    .boundary-label { fill: #62d6ca; }
    .boundary-line { stroke: #4ea9a2; }
    .card-generated { fill: #161b22; stroke: #5a477d; }
    .card-external { fill: #161b22; stroke: #326b66; }
    .card-governed { fill: #161b22; stroke: #3f6949; }
    .card-title { fill: #f0f6fc; }
    .card-detail { fill: #9da7b3; }
    .flow-line { stroke: #647489; }
    .connector { stroke: #47566a; }
    .pill-generated { fill: #2b2241; }
    .pill-external { fill: #173b38; }
    .pill-governed { fill: #1b3823; }
    .pill-text-generated { fill: #c2adf5; }
    .pill-text-external { fill: #76ddd3; }
    .pill-text-governed { fill: #8ed9a0; }
    .icon-generated { stroke: #b89cff; }
    .icon-external { stroke: #62d6ca; }
    .icon-governed { stroke: #7bd492; }
    .ledger-outline { stroke: #466887; }
    .ledger-title { fill: #ffffff; }
    .ledger-muted { fill: #b9cbe0; }
    .ledger-node { fill: #62d6ca; stroke: #d9fffb; }
    .receipt-icon { stroke: #ffffff; }
    .receipt-title { fill: #ffffff; }
    .receipt-copy { fill: #e8f3ff; }

    text {
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

  </style>

  <rect class="surface" x="1" y="1" width="1198" height="618" rx="28" />

  <text class="eyebrow" x="42" y="48" font-size="13" font-weight="750" letter-spacing="2.2">
    THE ITSELF LIFECYCLE
  </text>
  <text class="heading" x="42" y="82" font-size="27" font-weight="720">
    From model assertion to authorized action
  </text>
  <text class="subheading" x="42" y="108" font-size="15">
    Make model assertions and probabilities testable before software acts on them.
  </text>

  <rect class="zone-generated" x="26" y="128" width="484" height="216" rx="20" />
  <rect class="zone-external" x="524" y="128" width="322" height="216" rx="20" />
  <rect class="zone-governed" x="860" y="128" width="314" height="216" rx="20" />

  <text class="phase-generated" x="42" y="153" font-size="11" font-weight="750" letter-spacing="1.6">
    MODEL OUTPUT · UNVERIFIED
  </text>
  <text class="phase-external" x="540" y="153" font-size="11" font-weight="750" letter-spacing="1.6">
    INDEPENDENT CHECK
  </text>
  <text class="phase-governed" x="876" y="153" font-size="11" font-weight="750" letter-spacing="1.6">
    GOVERNED ACTION
  </text>

  <g fill="none" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)">
    <path class="flow-line" d="M 182 239 H 198" />
    <path class="flow-line" d="M 338 239 H 354" />
    <path class="flow-line" d="M 494 239 H 540" />
    <path class="flow-line" d="M 680 239 H 696" />
    <path class="flow-line" d="M 836 239 H 866" />
    <path class="flow-line" d="M 1006 239 H 1022" />
  </g>

  <g class="boundary-line" fill="none" stroke-width="1.5" stroke-dasharray="4 6">
    <path d="M 517 158 V 322" />
  </g>
  <g transform="translate(517 239)">
    <circle r="13" fill="#087e77" />
    <path d="M -5 0 L -1 4 L 6 -5" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <text class="boundary-label" x="517" y="333" font-size="9.5" font-weight="750" text-anchor="middle" letter-spacing="1">
    EXTERNAL CHECK
  </text>

  <g>
    <rect class="card-generated" x="42" y="168" width="140" height="142" rx="15" />
    <rect class="card-generated" x="198" y="168" width="140" height="142" rx="15" />
    <rect class="card-generated" x="354" y="168" width="140" height="142" rx="15" />
    <rect class="card-external" x="540" y="168" width="140" height="142" rx="15" />
    <rect class="card-external" x="696" y="168" width="140" height="142" rx="15" />
    <rect class="card-governed" x="866" y="168" width="140" height="142" rx="15" />
    <rect class="card-governed" x="1022" y="168" width="140" height="142" rx="15" />
  </g>

  <g class="icon-generated" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 112 185 V 205 M 102 195 H 122 M 105 188 L 119 202 M 119 188 L 105 202" />
    <path d="M 260 187 H 276 A 7 7 0 0 1 283 194 V 199 A 7 7 0 0 1 276 206 H 270 L 263 211 V 206 H 260 A 7 7 0 0 1 253 199 V 194 A 7 7 0 0 1 260 187 Z" />
    <circle cx="424" cy="196" r="11" />
    <circle cx="424" cy="196" r="4" />
    <path d="M 432 188 L 439 181 M 434 181 H 439 V 186" />
  </g>

  <g class="icon-external" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 603 184 H 617 M 607 184 V 193 L 600 205 A 4 4 0 0 0 604 211 H 616 A 4 4 0 0 0 620 205 L 613 193 V 184" />
    <path d="M 603 203 H 617" />
    <path d="M 753 197 C 760 187 772 187 779 197 C 772 207 760 207 753 197 Z" />
    <circle cx="766" cy="197" r="3.5" />
  </g>

  <g class="icon-governed" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 936 184 V 209 M 925 190 H 947 M 928 190 L 923 201 H 933 Z M 944 190 L 939 201 H 949 Z M 929 209 H 943" />
    <path d="M 1085 184 V 211 M 1085 186 H 1100 L 1096 193 L 1100 200 H 1085" />
  </g>

  <g class="card-title" font-size="16" font-weight="690" text-anchor="middle">
    <text x="112" y="232"><tspan x="112">Assertion or</tspan><tspan x="112" dy="20">probability</tspan></text>
    <text x="268" y="232"><tspan x="268">Claim or</tspan><tspan x="268" dy="20">hypothesis</tspan></text>
    <text x="424" y="242">Prediction</text>
    <text x="610" y="232"><tspan x="610">External</tspan><tspan x="610" dy="20">check</tspan></text>
    <text x="766" y="242">Evidence</text>
    <text x="936" y="242">Verdict</text>
    <text x="1092" y="242">Decision</text>
  </g>

  <g font-size="9.5" font-weight="750" text-anchor="middle" letter-spacing="0.9">
    <rect class="pill-generated" x="66" y="273" width="92" height="22" rx="11" />
    <text class="pill-text-generated" x="112" y="288">CAPTURED</text>
    <rect class="pill-generated" x="222" y="273" width="92" height="22" rx="11" />
    <text class="pill-text-generated" x="268" y="288">PROPOSED</text>
    <rect class="pill-generated" x="378" y="273" width="92" height="22" rx="11" />
    <text class="pill-text-generated" x="424" y="288">DECLARED</text>
    <rect class="pill-external" x="564" y="273" width="92" height="22" rx="11" />
    <text class="pill-text-external" x="610" y="288">EXECUTED</text>
    <rect class="pill-external" x="720" y="273" width="92" height="22" rx="11" />
    <text class="pill-text-external" x="766" y="288">OBSERVED</text>
    <rect class="pill-governed" x="890" y="273" width="92" height="22" rx="11" />
    <text class="pill-text-governed" x="936" y="288">EVALUATED</text>
    <rect class="pill-governed" x="1046" y="273" width="92" height="22" rx="11" />
    <text class="pill-text-governed" x="1092" y="288">AUTHORIZED</text>
  </g>

  <g class="connector" fill="none" stroke-width="1.3" stroke-dasharray="3 6">
    <path d="M 112 310 V 385" />
    <path d="M 268 310 V 385" />
    <path d="M 424 310 V 385" />
    <path d="M 610 310 V 385" />
    <path d="M 766 310 V 385" />
    <path d="M 936 310 V 385" />
    <path d="M 1092 310 V 385" />
  </g>

  <rect x="42" y="378" width="1120" height="104" rx="18" fill="#152844" class="ledger-outline" />
  <text class="ledger-title" x="68" y="410" font-size="13" font-weight="760" letter-spacing="1.7">
    VALIDATED EVIDENCE LEDGER
  </text>
  <text class="ledger-muted" x="68" y="438" font-size="14">
    Every step preserves scope, provenance, actor, authority, and invalidation history.
  </text>
  <path d="M 720 430 H 1114" fill="none" stroke="#62d6ca" stroke-width="2" stroke-linecap="round" />
  <g class="ledger-node" stroke-width="2">
    <circle cx="748" cy="430" r="5" />
    <circle cx="830" cy="430" r="5" />
    <circle cx="912" cy="430" r="5" />
    <circle cx="994" cy="430" r="5" />
    <circle cx="1076" cy="430" r="5" />
  </g>

  <path d="M 600 482 V 516" fill="none" stroke="#62d6ca" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arrow-bright)" />
  <text class="subheading" x="584" y="508" font-size="10" text-anchor="end" font-weight="700" letter-spacing="1">
    PROJECT
  </text>

  <g>
    <rect x="438" y="522" width="324" height="68" rx="16" fill="#5450b8" />
  </g>
  <g class="receipt-icon" transform="translate(466 542)" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 0 0 H 18 V 28 H 0 Z M 5 7 H 13 M 5 13 H 13 M 5 19 H 10" />
    <path d="M 13 0 V 6 H 18" />
  </g>
  <text class="receipt-title" x="506" y="550" font-size="16" font-weight="720">Reasoning receipt</text>
  <text class="receipt-copy" x="506" y="573" font-size="12.5">Replayable · digest-bound · inspectable</text>
</svg>
