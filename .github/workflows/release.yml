name: Release

# Publishing a GitHub release for a tag v<version> builds the distributions
# and uploads them to PyPI through trusted publishing. The upload job runs in
# the protected `pypi` environment, which the PyPI project trusts and which
# waits for a maintainer's approval.

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"

      - name: Check that the tag names the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [[ "$TAG" != "v$version" ]]; then
            echo "release tag $TAG does not name package version $version" >&2
            exit 1
          fi

      - name: Build distributions
        run: uv build

      - name: Verify distribution metadata
        run: uv run --frozen --extra release twine check --strict dist/*

      - name: Smoke-test built wheel
        run: |
          uv run --isolated --no-project --with dist/itself-*.whl \
            itself --version
          uv run --isolated --no-project --with dist/itself-*.whl \
            itself validate conformance/valid/proposed-claim.json

      - name: Keep distributions for the upload job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/itself/
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist/

      - name: Upload through trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
