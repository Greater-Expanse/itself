name: Release

# Publishing a GitHub release for a tag v<version> builds the distributions
# and uploads them to PyPI through trusted publishing. The upload job runs in
# the protected `pypi` environment, which the PyPI project trusts and which
# waits for a maintainer's approval.

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v9.0.0
        with:
          # A release build never restores or saves a shared cache.
          enable-cache: false
          python-version: "3.12"

      - name: Check that the tag names the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [[ "$TAG" != "v$version" ]]; then
            echo "release tag $TAG does not name package version $version" >&2
            exit 1
          fi

      - name: Build distributions
        run: uv build

      - name: Verify distribution metadata
        run: uv run --frozen --extra release twine check --strict dist/*

      - name: Smoke-test built wheel
        run: |
          uv run --isolated --no-project --with dist/itself-*.whl \
            itself --version
          uv run --isolated --no-project --with dist/itself-*.whl \
            itself validate conformance/valid/proposed-claim.json

      - name: Keep distributions for the upload job
        uses: actions/upload-artifact@v7.0.1
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/itself/
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8.0.1
        with:
          name: distributions
          path: dist/

      - name: Upload through trusted publishing
        uses: pypa/gh-action-pypi-publish@v1.14.2
